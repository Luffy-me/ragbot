services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uni-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uni_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uni_ai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-university_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uni_ai} -d ${POSTGRES_DB:-university_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uni-ai-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: uni-ai-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uni_ai}:${POSTGRES_PASSWORD:-uni_ai_secret}@postgres:5432/${POSTGRES_DB:-university_ai}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - embedding_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - uni-ai-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: uni-ai-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - uni-ai-net

volumes:
  postgres_data:
  uploads_data:
  embedding_cache:

networks:
  uni-ai-net:
    driver: bridge
